<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="ResearchLab, an accessible student research workspace connected to StatLab Pro.">
<title>ResearchLab | Student Research Workspace</title>
<!--
  RESEARCHLAB MAINTENANCE MAP
  1. Styles: foundations and reusable components, StatLab shell/toolbar, green system,
     home layout, responsive rules and accessibility. Keep component layout properties together.
     Brand lockup and navigation shortcut chips use fixed flex sizing to prevent glyph compression.
  2. App shell: header, project switcher, sidebar navigation, routed main area, persistent StatLab.
  3. Core script: local state/persistence, shared helpers, page renderers, report/export and navigation.
  4. Feature layer: ResearchFlow, literature/gap review, SurveyCheck, DataDoctor and StatLab adapter.
  5. UI integration: routed rendering, global event wiring, persistent StatLab bridge and later feature additions.
  Keep project state and the StatLab message protocol backward-compatible when extending features.
-->

<style>
/* 01. Foundations: theme tokens, app shell, reusable components and primitives */

:root{
 --rl-bg:#f5faf8;--rl-card:#ffffff;--rl-soft:#f8fcfb;--rl-ink:#1a3029;--rl-muted:#6b837b;
 --rl-line:#e0ede9;--rl-blue:#087f73;--rl-blue-soft:#e0f3ed;--rl-green:#18794e;
 --rl-yellow:#9b6500;--rl-red:#b42318;--rl-shadow:0 8px 28px rgba(24, 56, 45,.07);
 --rl-radius:14px
}

html,body{height:100%;margin:0}
body{font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--rl-bg);color:var(--rl-ink)}

button{cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid rgba(74, 226, 175,.28);outline-offset:2px}
.rl-app{height:100%;display:grid;grid-template-rows:62px 1fr}
.rl-top{background:#1b322a;color:#ffffff;display:flex;align-items:center;gap:16px;padding:0 18px;box-shadow:0 2px 14px rgba(24, 66, 52,.18);z-index:10}
.rl-brand{font-weight:850;font-size:19px;letter-spacing:-.02em}.rl-brand span{color:#b2deca}
.rl-project-switch{display:flex;align-items:center;gap:8px;min-width:0}
.rl-project-switch select{max-width:360px;background:rgba(255, 255, 255,.1);border:1px solid rgba(255, 255, 255,.2);color:#ffffff;border-radius:8px;padding:7px 10px}
.rl-project-switch option{color:#1a3029}
.rl-storage{margin-left:auto;font-size:12px;color:#d7ebe4;background:rgba(255, 255, 255,.09);padding:5px 10px;border-radius:999px}
.rl-top-actions{display:flex;gap:6px}.rl-iconbtn{border:1px solid rgba(255, 255, 255,.18);background:rgba(255, 255, 255,.07);color:#ffffff;border-radius:8px;padding:7px 9px}
.rl-body{min-height:0;display:grid;grid-template-columns:236px minmax(0,1fr)}
.rl-side{background:var(--rl-card);border-right:1px solid var(--rl-line);overflow:auto;padding:12px 9px}
.rl-nav-section{padding:13px 10px 6px;font-size:10px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;color:var(--rl-muted)}
.rl-nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:transparent;color:var(--rl-ink);text-align:left;padding:9px 11px;border-radius:9px;margin:2px 0}
.rl-nav button:hover{background:var(--rl-soft)}.rl-nav button.active{background:var(--rl-blue-soft);color:var(--rl-blue);font-weight:750}
.rl-nav .ni{width:22px;text-align:center;font-size:16px}.rl-nav .kbd{margin-left:auto;font-size:10px;color:var(--rl-muted)}
.rl-main{min-width:0;min-height:0;overflow:auto}
.rl-page{max-width:1280px;margin:0 auto;padding:26px}
.rl-page h1{font-size:27px;letter-spacing:-.03em;margin:0}.rl-page h2{font-size:19px;margin:0}.rl-page h3{font-size:14px;margin:0 0 8px}.rl-lead{color:var(--rl-muted);max-width:820px;margin:5px 0 0}
.rl-header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:20px}.rl-actions{display:flex;gap:7px;flex-wrap:wrap}
.rl-btn{border:1px solid var(--rl-line);background:#ffffff;color:var(--rl-ink);border-radius:8px;padding:8px 11px}.rl-btn:hover{border-color:var(--rl-blue);box-shadow:0 4px 12px rgba(74, 226, 175,.1)}.rl-btn.primary{background:var(--rl-blue);border-color:var(--rl-blue);color:#ffffff}.rl-btn.danger{color:var(--rl-red)}
.rl-grid{display:grid;gap:13px}.rl-grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.rl-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.rl-grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.rl-card{background:var(--rl-card);border:1px solid var(--rl-line);border-radius:var(--rl-radius);box-shadow:var(--rl-shadow);padding:16px}.rl-card.soft{background:var(--rl-soft);box-shadow:none}
.rl-stat{font-size:25px;font-weight:850;margin-top:4px}.rl-label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--rl-muted);font-weight:800}
.rl-muted{color:var(--rl-muted)}.rl-small{font-size:12px}.rl-note{padding:10px 12px;background:var(--rl-blue-soft);border-left:3px solid var(--rl-blue);border-radius:0 8px 8px 0}
.rl-warn{padding:10px 12px;background:#fff8e8;border-left:3px solid #d49a22;border-radius:0 8px 8px 0}.rl-error{padding:10px 12px;background:#fff1ef;border-left:3px solid var(--rl-red);border-radius:0 8px 8px 0}
.rl-status{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 8px;font-size:11px;font-weight:750;background:#f1f6f4;color:#5b716a}
.rl-status.good{background:#eaf7f0;color:var(--rl-green)}.rl-status.warn{background:#fff4d7;color:var(--rl-yellow)}.rl-status.bad{background:#ffe9e6;color:var(--rl-red)}.rl-status.blue{background:var(--rl-blue-soft);color:var(--rl-blue)}
.rl-form{display:grid;gap:11px}.rl-field label{display:block;font-weight:750;font-size:12px;margin-bottom:5px}.rl-field input,.rl-field select,.rl-field textarea{width:100%;border:1px solid var(--rl-line);border-radius:8px;padding:8px;background:#ffffff;color:var(--rl-ink)}.rl-field textarea{min-height:90px;resize:vertical}
.rl-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.rl-row.three{grid-template-columns:repeat(3,1fr)}
.rl-table-wrap{overflow:auto;border:1px solid var(--rl-line);border-radius:10px}.rl-table{border-collapse:collapse;width:100%;min-width:650px;font-size:12px}.rl-table th,.rl-table td{padding:8px 9px;border-bottom:1px solid var(--rl-line);vertical-align:top;text-align:left}.rl-table th{background:var(--rl-soft);font-size:11px}.rl-table tr:last-child td{border-bottom:0}
.rl-empty{text-align:center;padding:45px 15px;color:var(--rl-muted)}.rl-empty strong{display:block;color:var(--rl-ink);font-size:15px;margin-bottom:4px}
.rl-progress{height:7px;background:#eaf2ef;border-radius:99px;overflow:hidden}.rl-progress i{display:block;height:100%;background:var(--rl-blue);border-radius:99px}
.rl-stepper{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:18px 0}.rl-step{padding:8px 7px;border:1px solid var(--rl-line);border-radius:9px;text-align:center;font-size:11px;color:var(--rl-muted);background:#ffffff}.rl-step.on{color:var(--rl-blue);border-color:#a8d9c7;background:var(--rl-blue-soft);font-weight:750}
.rl-card-link{border:1px solid var(--rl-line);background:#ffffff;border-radius:12px;padding:15px;text-align:left}.rl-card-link:hover{border-color:var(--rl-blue);transform:translateY(-1px)}.rl-card-link b{display:block;margin-bottom:4px}
.rl-tabs{display:flex;gap:5px;overflow:auto;border-bottom:1px solid var(--rl-line);margin-bottom:15px}.rl-tabs button{border:0;background:transparent;padding:9px 11px;color:var(--rl-muted);white-space:nowrap}.rl-tabs button.active{color:var(--rl-blue);font-weight:800;border-bottom:2px solid var(--rl-blue)}
.rl-checklist{display:grid;gap:8px}.rl-check{display:flex;gap:9px;align-items:flex-start;padding:10px;border:1px solid var(--rl-line);border-radius:9px}.rl-check input{margin-top:3px}
.rl-modal-bg{position:fixed;inset:0;background:rgba(12, 33, 26,.52);display:grid;place-items:center;z-index:100;padding:18px}.rl-modal{background:#ffffff;border-radius:15px;width:min(720px,96vw);max-height:90vh;overflow:auto;padding:21px;box-shadow:0 25px 70px rgba(0, 0, 0,.3)}.rl-modal-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.rl-close{border:0;background:transparent;font-size:22px;color:var(--rl-muted)}
.rl-toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:200;background:#1b322a;color:#ffffff;padding:9px 15px;border-radius:999px;font-size:13px}
.rl-stats-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.rl-danger-zone{border:1px solid #f0c7c2;background:#fff8f7}
.rl-report{background:#ffffff;padding:35px;max-width:920px;margin:auto;border:1px solid var(--rl-line);box-shadow:var(--rl-shadow)}.rl-report h1{font-size:25px}.rl-report h2{font-size:17px;border-bottom:1px solid #dddddd;padding-bottom:5px;margin-top:25px}.rl-report table{width:100%;border-collapse:collapse;font-size:12px}.rl-report th,.rl-report td{padding:6px;border-bottom:1px solid #dddddd;text-align:left}.rl-report .apa{font-family:"Times New Roman",Times,serif}
.rl-statlab{height:calc(100vh - 62px);display:flex;flex-direction:column}.rl-statlabbar{background:var(--rl-card);border-bottom:1px solid var(--rl-line);padding:8px 13px;display:flex;align-items:center;gap:8px}.rl-statlabbar .rl-muted{margin-right:auto}.rl-statlab iframe{width:100%;height:100%;border:0;background:#ffffff}
.rl-kicker{color:var(--rl-blue);font-size:11px;font-weight:850;text-transform:uppercase;letter-spacing:.08em}
.rl-filter{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}.rl-filter input,.rl-filter select{border:1px solid var(--rl-line);border-radius:8px;padding:7px;background:#ffffff}
.rl-pillrow{display:flex;gap:5px;flex-wrap:wrap}.rl-pill{border:1px solid var(--rl-line);padding:4px 7px;border-radius:999px;font-size:11px}
.rl-timeline{display:grid;gap:8px}.rl-event{display:grid;grid-template-columns:125px 1fr;gap:10px;font-size:12px;padding-bottom:8px;border-bottom:1px solid var(--rl-line)}
@media(max-width:1050px){.rl-body{grid-template-columns:205px 1fr}.rl-grid.four,.rl-stats-grid{grid-template-columns:repeat(2,1fr)}.rl-grid.three{grid-template-columns:1fr 1fr}}
@media(max-width:760px){.rl-app{grid-template-rows:58px 1fr}.rl-top{padding:0 10px}.rl-brand{font-size:16px}.rl-project-switch{display:none}.rl-body{display:block}.rl-side{position:fixed;left:0;top:58px;bottom:0;width:245px;z-index:50;transform:translateX(-105%);transition:transform .2s;box-shadow:12px 0 30px rgba(0, 0, 0,.12)}.rl-side.open{transform:none}.rl-main{min-height:calc(100vh - 58px)}.rl-page{padding:18px 13px}.rl-header{display:block}.rl-actions{margin-top:12px}.rl-grid.two,.rl-grid.three,.rl-grid.four,.rl-row,.rl-row.three{grid-template-columns:1fr}.rl-stepper{grid-template-columns:repeat(3,1fr)}.rl-storage{display:none}.rl-stats-grid{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.rl-top,.rl-side,.rl-actions,.rl-statlabbar{display:none!important}.rl-main{overflow:visible}.rl-page{padding:0}.rl-report{box-shadow:none;border:0}}



/* 02. Persistent StatLab shell structure
   Kept mounted outside the routed page so running analyses survive navigation. */
#rlMain:has(.rl-statlab){overflow:hidden;max-width:none}
.rl-statlab-shell{
  position:fixed;display:none;flex-direction:column;top:68px;left:248px;right:0;bottom:0;
  z-index:8;min-width:0;min-height:0;background:var(--rl-bg)
}
.rl-statlab-shell.active{display:flex}
.rl-statlab-shell .rl-statlabbar{width:100%}
.rl-statlab-shell .rl-statlab-framehost{flex:1;min-height:0;width:100%;overflow:hidden;background:var(--rl-bg)}
.rl-statlab-shell .rl-statlab-framehost iframe{display:block;width:100%;height:100%;min-height:0;border:0;background:var(--rl-bg)}
.rl-main.rl-under-statlab{visibility:hidden;pointer-events:none}
/* 03. StatLab toolbar: compact navigation, actions and responsive behavior */
.rl-statlabbar{display:flex;flex-wrap:nowrap;gap:10px;padding:8px 12px;min-height:62px;align-items:center}
.rl-statlab-head{flex:0 0 180px;min-width:155px;gap:8px}
.rl-statlab-icon{width:32px;height:32px;font-size:17px}
.rl-statlab-title strong{font-size:12px}.rl-statlab-title span{font-size:9px;line-height:1.35;white-space:normal;max-width:175px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rl-statlab-tabs{display:flex;align-items:center;gap:3px;flex:1 1 auto;min-width:0;overflow:auto;padding:3px 8px;border-left:1px solid #d9e5dc;border-right:1px solid #d9e5dc}
.rl-statlab-tabs button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:34px;padding:7px 9px;border:1px solid transparent;border-radius:8px;background:transparent;color:#506a60;font-size:10px;font-weight:750;white-space:nowrap;cursor:pointer}
.rl-statlab-tabs button span{font-weight:900;color:#087f73;font-size:13px}
.rl-statlab-tabs button:hover{background:#eef6f0;color:#173d36}
.rl-statlab-tabs button.active{background:#dff3e9;border-color:#c5e5d7;color:#08695f}
.rl-statlab-actions{flex:0 0 auto;gap:4px;flex-wrap:nowrap}
.rl-statlab-actions .rl-btn{min-height:32px;padding:7px 8px;font-size:10px;border-radius:8px;white-space:nowrap}
.rl-statlab-actions #rlStatLoadState{font-size:8px;padding:4px 6px;white-space:nowrap}
.rl-statlab-actions #rlBackData{padding:7px 8px}
.rl-statlab-actions #rlSendCurrent{padding:7px 8px}
.rl-statlab-more-wrap{position:relative;flex:none}
.rl-statlab-more-wrap #rlStatMore{min-height:32px;padding:7px 9px;font-size:10px;white-space:nowrap}
.rl-statlab-more{position:absolute;right:0;top:calc(100% + 7px);z-index:30;display:grid;gap:5px;min-width:185px;padding:8px;background:#fffefa;border:1px solid #d8e4db;border-radius:11px;box-shadow:0 12px 30px rgba(24, 50, 42,.15)}
.rl-statlab-more[hidden]{display:none!important}
.rl-statlab-more .rl-btn{width:100%;text-align:left;justify-content:flex-start;font-size:11px;min-height:34px}

@media(max-width:1380px){.rl-statlab-head{flex-basis:145px;min-width:135px}.rl-statlab-tabs{padding:3px 5px}.rl-statlab-tabs button{padding:7px 6px;font-size:9px}.rl-statlab-actions .rl-btn{padding:6px 6px;font-size:9px}.rl-statlab-title span{max-width:135px}}
@media(max-width:1180px){.rl-statlabbar{flex-wrap:wrap;gap:6px}.rl-statlab-head{flex:1 1 210px}.rl-statlab-tabs{order:3;flex:1 1 100%;border:0;border-top:1px solid #e3ebe5;padding:6px 0 0}.rl-statlab-actions{margin-left:auto}.rl-statlab-actions #rlStatLoadState{display:none}}
@media(max-width:760px){.rl-statlabbar{padding:9px 10px}.rl-statlab-head{flex:1 1 100%}.rl-statlab-tabs{order:2;overflow:auto}.rl-statlab-tabs button{flex:1;padding:7px 6px}.rl-statlab-actions{order:3;width:100%;justify-content:flex-start;overflow-x:auto;margin:0}.rl-statlab-actions .rl-btn{font-size:10px;padding:7px 8px}.rl-statlab-title span{max-width:calc(100vw - 80px)}}




/* 04. Green visual system: shared theme, components, forms, tables and responsive rules */
/* Sidebar structure is explicit: fixed-size identity mark, stacked labels, flexible nav, anchored footer. */
:root{
 --rl-bg:#f4f4ed;--rl-card:#fffefa;--rl-soft:#eef2e9;--rl-ink:#1a302c;--rl-muted:#6d7e78;
 --rl-line:#dbe3dc;--rl-blue:#087f73;--rl-blue-soft:#e0f3ed;--rl-green:#287b54;
 --rl-yellow:#93601f;--rl-red:#ad443c;--rl-shadow:0 5px 20px rgba(22, 54, 45,.045);--rl-radius:14px;
}
html{scroll-behavior:smooth;scrollbar-color:#b8cfc2 #f4f4ed}
body{background:var(--rl-bg);color:var(--rl-ink);text-rendering:optimizeLegibility;-webkit-font-smoothing:antialiased}
button,input,select,textarea{accent-color:#087f73}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{
 outline:3px solid rgba(8, 127, 115,.22)!important;outline-offset:2px!important;
}
.rl-app{background:var(--rl-bg);grid-template-rows:68px minmax(0,1fr)}
.rl-top{background:#fffefa;color:#1a302c;border-bottom:1px solid #dce4dd;box-shadow:0 2px 0 rgba(21, 53, 44,.025);padding:0 22px;gap:15px}
/* Brand lockup: keep the logo glyph at a fixed size and align it with the wordmark. */
.rl-brand{display:flex;align-items:center;flex:0 0 auto;gap:9px;min-width:max-content;font-size:18px;line-height:1;white-space:nowrap}
.rl-brand-mark{display:grid;place-items:center;flex:0 0 34px;width:34px;height:34px;min-width:34px;min-height:34px;line-height:1;text-align:center;font-size:17px;font-weight:900;border-radius:10px;background:#173d36;color:#bcf0df;box-shadow:none}
.rl-brand-word{display:inline-block;flex:0 0 auto;line-height:1;white-space:nowrap;color:#1a302c!important}.rl-brand-word span{display:inline;color:#087f73!important}
.rl-project-switch{display:flex;align-items:center;gap:8px;min-width:0;margin-left:8px;padding:5px 6px 5px 10px;border:1px solid #dce5dd;border-radius:13px;background:#f4f7f0}
.rl-project-switch>span{font-size:10px;font-weight:800;letter-spacing:.075em;text-transform:uppercase;color:#718179;white-space:nowrap}
.rl-project-switch select{
 display:block;width:clamp(185px,25vw,310px);min-width:0;max-width:calc(100vw - 540px);
 height:40px;padding:8px 34px 8px 11px;border:1px solid #d4e0d7;border-radius:9px;

}

.rl-project-switch option{background:#fffefa!important;color:#1a302c!important}
#rlNewProject{width:40px;height:40px;min-width:40px;padding:0;background:#fffefa;color:#087f73;border:1px solid #cddfd4;border-radius:10px;font-size:22px;font-weight:650;line-height:1}
#rlNewProject:hover{background:#e7f3e9;border-color:#8bc7b5}
.rl-iconbtn{background:#fffefa;color:#34534b;border-color:#d8e2da;border-radius:10px;min-width:38px;min-height:38px}
.rl-iconbtn:hover{background:#eef6f0;border-color:#a9d2c3;color:#174c41}
.rl-storage{background:#edf5ee;color:#4d725c;border:1px solid #dcebe0;border-radius:999px}
.rl-body{grid-template-columns:248px minmax(0,1fr);height:calc(100dvh - 68px);background:var(--rl-bg)}
.rl-side{display:flex;flex-direction:column;gap:8px;min-height:0;background:#17362f;border:0;border-right:1px solid #284b43;box-shadow:none;padding:14px 11px 12px;color:#f2f7f2}
.rl-side-intro{display:flex;align-items:center;gap:10px;flex:none;min-width:0;border:0;border-bottom:1px solid #31544b;padding:9px 10px 17px;margin:0 2px 2px}.rl-side-intro>div:last-child{min-width:0}.rl-side-mark{width:36px;height:36px;display:grid;place-items:center;flex:none;background:#27564c;color:#bcefe0;border-radius:10px;font-size:12px;font-weight:900;letter-spacing:-.04em}
.rl-side-intro strong{display:block;font-size:12px;line-height:1.35;color:#f4f8f3}.rl-side-intro span{display:block;margin-top:3px;font-size:10px;line-height:1.45;color:#a6c3b8}
.rl-nav{overflow:auto;flex:1;min-height:0}.rl-nav-section{flex:none;color:#8fb4a8;padding:17px 10px 7px;font-size:9px;letter-spacing:.15em}

.rl-nav-backdrop{position:fixed;inset:86px 0 0;background:rgba(9,25,20,.55);z-index:55;border:0;padding:0}
.rl-nav-backdrop[hidden]{display:none!important}
@media(max-width:760px){
 .rl-side{z-index:60;overscroll-behavior:contain}
 .rl-statlab-shell{left:0!important}
 .rl-storage{display:block!important;position:fixed;bottom:8px;left:8px;z-index:4;max-width:calc(100vw - 16px);white-space:normal;box-shadow:0 2px 8px rgba(0,0,0,.12)}
 .rl-page{padding:20px 14px 58px!important}
 .rl-header{gap:8px}
 .rl-table-wrap{max-width:100%;-webkit-overflow-scrolling:touch}
 .rl-modal{padding:22px 15px 18px}
 .rl-filter .rl-filter-field{width:100%;min-width:0}
}
@media(max-width:360px){.rl-brand-word{max-width:126px}.rl-project-switch select{font-size:11px!important}.rl-btn{white-space:normal}.rl-storage{font-size:11px!important}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto!important}*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}

<div id="rlApp" class="rl-app">
  <header class="rl-top">
    <button class="rl-iconbtn" id="rlMenu" aria-label="Open navigation">☰</button>
    <div class="rl-brand"><span class="rl-brand-mark" aria-hidden="true">R</span><span class="rl-brand-word">Research<span>Lab</span></span></div>

  <div class="rl-body">

        <div class="rl-nav-section">Research workflow</div>

        <button data-page="literature" title="Literature review"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 3.5h10l4 4V21H5z"/><path d="M15 3.5V8h4M8 12h8M8 16h8"/></svg></span><span class="rl-nav-label">Literature</span></button>
        <button data-page="gaps" title="GapFinder"><span class="ni" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 2.8 9 9.2-9 9.2-9-9.2z"/><path d="M12 7.5v5M12 16.5h.01"/></svg></span><span class="rl-nav-label">GapFinder</span></button>

</div>

      <button class="rl-btn" id="rlBackData" title="Return to DataDoctor">← DataDoctor</button>

    </div>
  </div>
  <div id="rlStatFrameHost" class="rl-statlab-framehost" aria-label="StatLab statistics workspace"></div>
</div>

function parseDelimited(inputText){
 const t=String(inputText??"").replace(/^\uFEFF/,"");
 const first=t.split(/\r?\n/,1)[0]||"";
 const seps=[",",";","\t","|"];
 const sep=seps.reduce((best,candidate)=>first.split(candidate).length>first.split(best).length?candidate:best,",");
 const rows=[];let row=[],cur="",quoted=false;
 for(let i=0;i<t.length;i++){
  const ch=t[i];
  if(quoted){if(ch==='"'){if(t[i+1]==='"'){cur+='"';i++}else quoted=false}else cur+=ch}
  else if(ch==='"')quoted=true;
  else if(ch===sep){row.push(cur);cur=""}
  else if(ch==="\n"){row.push(cur);rows.push(row);row=[];cur=""}
  else if(ch==="\r"){if(t[i+1]==="\n")i++;row.push(cur);rows.push(row);row=[];cur=""}
  else cur+=ch;
 }
 if(cur!==""||row.length){row.push(cur);rows.push(row)}
 return rows;
}
function matrixToDataset(M,name){
 M=M.filter(r=>r.some(v=>String(v??"").trim()!==""));if(M.length<2)throw Error("Need a header row and at least one data row.");
 const w=Math.max(...M.map(r=>r.length));const raw=M[0].map((v,i)=>String(v??"").trim()||"Variable"+(i+1));const seen={};const cols=raw.map(c=>{let x=c.replace(/\s+/g," ").trim(),base=x||"Variable";let k=base,i=2;while(seen[k])k=base+"_"+i++;seen[k]=1;return k});const rows=M.slice(1).map(r=>cols.map((_,i)=>r[i]??""));const types={};cols.forEach((c,i)=>{const vals=rows.map(r=>r[i]).filter(v=>String(v).trim()!=="");const numeric=vals.length>0&&vals.every(v=>Number.isFinite(Number(String(v).replace(",","."))));types[c]=numeric?"number":"string"});return makeDataset(cols,rows,types,name)}
function makeDataset(cols,rows,types,name,parentId=null,transformation=null,isRaw=true){
 const d={id:uidRL(),projectId:state.id,name,versionNumber:(Math.max(0,...state.datasets.map(x=>x.versionNumber||0))+1),cols,rows,types,labels:{},createdAt:nowRL(),fingerprint:hashRL({cols,rows,types}),isRaw,parentId,transformation,issues:[]};
 d.issues=auditDataset(d);return d;
}
function auditDataset(d){
 const issues=[],n=d.rows.length;
 d.cols.forEach((c,j)=>{const vals=d.rows.map(r=>r[j]);const missing=vals.filter(v=>v===null||v===undefined||String(v).trim()==="").length;if(missing)issues.push({id:uidRL(),type:"missing",severity:"warning",title:`Missing values in ${c}`,count:missing,explanation:`${missing} of ${n} rows are blank.`});const set=new Set(vals.filter(v=>String(v).trim()!=="").map(v=>String(v).trim()));if(set.size===1&&n>1)issues.push({id:uidRL(),type:"constant",severity:"warning",title:`Constant column ${c}`,count:n,explanation:"All observed values are identical, so it may not provide variation for an analysis."});if(d.types[c]==="number"){const bad=vals.filter(v=>String(v).trim()!==""&&!Number.isFinite(Number(String(v).replace(",",".")))).length;if(bad)issues.push({id:uidRL(),type:"type_mixture",severity:"warning",title:`Non-numeric values in ${c}`,count:bad,explanation:"The column was inferred as numeric but contains values that cannot be parsed as numbers."});}});
 const signatures=new Map();d.rows.forEach((r,i)=>{const k=JSON.stringify(r);if(signatures.has(k)){}else signatures.set(k,i)});const dup=d.rows.length-signatures.size;if(dup)issues.push({id:uidRL(),type:"duplicate",severity:"warning",title:"Duplicate rows",count:dup,explanation:"Rows with identical values were detected. Review whether duplicates are legitimate."});
 const emptyRows=d.rows.filter(r=>r.every(v=>String(v??"").trim()==="")).length;if(emptyRows)issues.push({id:uidRL(),type:"empty_rows",severity:"warning",title:"Empty rows",count:emptyRows,explanation:"Completely blank rows were found."});
 return issues;
}

    ${unresolved.length?`<details class="rl-ux-disclosure"><summary><span><b>Alignment checks to review</b><small>${unresolved.length} highlighted item${unresolved.length===1?'':'s'} · automated checks are suggestions</small></span><span class="rl-ux-chevron" aria-hidden="true">⌄</span></summary><div class="rl-ux-disclosure-body"><div class="rl-ux-review-list">${unresolved.map(x=>`<div class="rl-ux-review-item"><i aria-hidden="true"></i><span><b>${escRL(x.title)}</b><small>${escRL(x.explanation)}</small></span></div>`).join('')}</div><div class="rl-ux-inline-actions"><button class="rl-btn" data-homego="flow">Review in ResearchFlow →</button></div></div></details>`:''}
    <details class="rl-ux-disclosure"><summary><span><b>Recent activity & project files</b><small>${recent.length?`${recent.length} recent saved actions`:'No activity recorded yet'} · backups and storage</small></span><span class="rl-ux-chevron" aria-hidden="true">⌄</span></summary><div class="rl-ux-disclosure-body">${recent.length?`<div class="rl-ux-activity">${recent.map(e=>`<div class="rl-ux-activity-row"><time>${new Date(e.at).toLocaleString()}</time><div><b>${escRL(String(e.type).replaceAll('_',' '))}</b><span>${escRL(e.summary)}</span></div></div>`).join('')}</div>`:`<div class="rl-ux-empty">No saved activity yet. Important actions will appear here as you work.</div>`}<div class="rl-ux-details-separator"></div><div class="rl-ux-inline-actions"><button class="rl-btn" id="rlBackup">Download project backup</button><button class="rl-btn" data-homego="settings">Storage settings</button></div><p class="rl-small rl-muted" style="margin:10px 0 0">This standalone workspace saves in this browser. Download a backup before clearing browser storage or moving to another device.</p></div></details>
   </div>
  </div>`;
 };

 const oldWire=wireGlobalPage;
 wireGlobalPage=function(){
  oldWire();
  $$rl('#rlMain [data-homego]').forEach(b=>b.onclick=()=>setPage(b.dataset.homego));
 };

 function buildNavAccordion(){
  const nav=$rl('.rl-nav');
  if(!nav||nav.dataset.uxAccordion==='true')return;
  const nodes=Array.from(nav.children);nav.innerHTML='';let group=null;
  nodes.forEach(node=>{
   if(node.classList&&node.classList.contains('rl-nav-section')){
    group=document.createElement('details');group.className='rl-nav-group';
    const label=node.textContent.trim();group.dataset.label=label;
    const summary=document.createElement('summary');summary.textContent=label;group.appendChild(summary);
    nav.appendChild(group);
   }else if(group){group.appendChild(node)}else{nav.appendChild(node)}
  });
  nav.dataset.uxAccordion='true';
  // Treat the sidebar as a true accordion: opening one group closes the others.
  nav.querySelectorAll('.rl-nav-group').forEach(group=>group.addEventListener('toggle',()=>{
   if(group.open)nav.querySelectorAll('.rl-nav-group').forEach(other=>{if(other!==group)other.open=false});
  }));
  // Keep the optional analytics helper discoverable without a floating button over page content.
  const statsGroup=nav.querySelector('.rl-nav-group[data-label="Data & statistics"]');
  if(statsGroup&&!statsGroup.querySelector('.rl-nav-action')){
   const extra=document.createElement('button');extra.type='button';extra.className='rl-nav-action';extra.innerHTML='<span class="ni" aria-hidden="true">✦</span><span class="rl-nav-label">Analytics lab</span><span class="rl-nav-badge">Extra</span>';
   extra.setAttribute('title','Open supplementary analytics tools');extra.onclick=()=>RLL.open('rel');statsGroup.appendChild(extra);
  }
  setNavGroup(activePage);
 }
 function setNavGroup(page){
  const nav=$rl('.rl-nav');if(!nav)return;
  const groups=Array.from(nav.querySelectorAll('.rl-nav-group'));
  let found=null;
  groups.forEach(g=>{if(g.querySelector(`[data-page="${page}"]`))found=g});
  groups.forEach(g=>{g.open=(g===found)});
 }
 const oldSetPage=setPage;
 setPage=function(page){const result=oldSetPage(page);setNavGroup(page);return result};

 // Small, neutral disclosure chevrons and keyboard-friendly navigation groups.
 try{buildNavAccordion();}catch(e){console.warn('Navigation accordion could not be initialized.',e)}
 try{if(typeof renderPage==='function'&&typeof state!=='undefined')renderPage();}catch(e){console.error('UX refresh rendering failed.',e)}
})();

</script>

<script>
/* ResearchLab final integration: truthful storage, working literature filters, accessible dialogs and mobile drawer. */
(function(){
  'use strict';
  const activeModalState={opener:null,background:[],keyHandler:null};
  let literatureQuery='', literatureStatus='';
  let navBackdrop=null;
  const $=(q,r=document)=>r.querySelector(q);
  const $$=(q,r=document)=>Array.from(r.querySelectorAll(q));
  const esc=(v)=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // Convert all legacy storage status copy into a truthful status and expose it to assistive technology.
  updateStorage=function(){
    const el=$('#rlStorage');if(!el)return;
    const persistent=RLStore.isPersistent();
    if(persistent){el.textContent='Saved in this browser';el.removeAttribute('aria-label');el.title='Project data is written to browser local storage.'}
    else{el.textContent='Session only · export backup';el.setAttribute('aria-label','Session-only storage');el.title='Persistent browser storage is unavailable. Changes may be lost on refresh; download a project JSON backup.'}
    el.setAttribute('role','status');el.setAttribute('aria-live','polite');
    const foot=$('.rl-side-foot span:last-child');if(foot)foot.textContent=persistent?'Saved in this browser':'Session only — download a backup';
    const detail=$('#rlStorageDetails');if(detail)detail.textContent=persistent?'Persistent browser storage is available. Your project is saved on this device; it is not automatically uploaded.':'Persistent browser storage is unavailable. ResearchLab is holding changes in memory for this session only. Export a JSON backup before closing or refreshing this page.';
  };

  // Keep a persistent live region for transient messages; errors are announced as alerts.
  toastRL=function(message){
    let el=$('#rlLiveToast');if(!el){el=document.createElement('div');el.id='rlLiveToast';el.className='rl-live-toast';el.setAttribute('role','status');el.setAttribute('aria-live','polite');el.setAttribute('aria-atomic','true');document.body.appendChild(el)}
    const msg=String(message??'');const kind=/failed|error|could not|unavailable|not saved|rejected|cannot/i.test(msg)?'error':/session.only|warning|not found|limited|review/i.test(msg)?'warning':'success';
    el.dataset.kind=kind;el.setAttribute('role',kind==='error'?'alert':'status');el.setAttribute('aria-live',kind==='error'?'assertive':'polite');el.textContent=msg;el.hidden=false;
    clearTimeout(el._rlTimer);el._rlTimer=setTimeout(()=>{el.hidden=true},4200);
  };

  // Modal pattern: name, close control, initial focus, focus containment, inert background and focus return.
  const previousModal=modalRL;
  modalRL=function(inner,wire){
    if($('.rl-modal-bg'))closeModalRL();
    const opener=document.activeElement;
    const bg=document.createElement('div');bg.className='rl-modal-bg';
    bg.innerHTML='<div class="rl-modal" role="dialog" aria-modal="true" tabindex="-1">'+inner+'</div>';
    const dialog=$('.rl-modal',bg);
    let heading=$('h2, h3',dialog);
    if(heading){if(!heading.id)heading.id='rl-dialog-title-'+uidRL();dialog.setAttribute('aria-labelledby',heading.id)}
    else dialog.setAttribute('aria-label','ResearchLab dialog');
    const close=document.createElement('button');close.type='button';close.className='rl-modal-quick-close';close.setAttribute('aria-label','Close dialog');close.title='Close dialog';close.textContent='×';close.addEventListener('click',()=>closeModalRL());dialog.insertBefore(close,dialog.firstChild);
    activeModalState.opener=opener;activeModalState.background=[];
    Array.from(document.body.children).forEach(node=>{if(node!==bg){activeModalState.background.push([node,node.inert]);node.inert=true}});
    document.body.appendChild(bg);
    bg.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>closeModalRL()));
    bg.addEventListener('mousedown',ev=>{if(ev.target===bg)closeModalRL()});
    const keyHandler=(ev)=>{
      if(!bg.isConnected)return;
      if(ev.key==='Escape'){ev.preventDefault();ev.stopPropagation();closeModalRL();return}
      if(ev.key!=='Tab')return;
      const focusables=$$('a[href],button:not([disabled]),input:not([disabled]):not([type="hidden"]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])',dialog).filter(el=>!el.hidden&&el.getAttribute('aria-hidden')!=='true'&&el.offsetParent!==null);
      if(!focusables.length){ev.preventDefault();dialog.focus();return}
      const first=focusables[0],last=focusables[focusables.length-1];
      if(ev.shiftKey&&(document.activeElement===first||!dialog.contains(document.activeElement))){ev.preventDefault();last.focus()}
      else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}
    };
    activeModalState.keyHandler=keyHandler;document.addEventListener('keydown',keyHandler,true);
    if(typeof wire==='function'){try{wire()}catch(err){console.error('Dialog action setup failed',err);toastRL('Dialog controls could not be initialized. Close it and retry.')}}
    requestAnimationFrame(()=>{
      const target=$('input:not([type="hidden"]),select,textarea,button:not(.rl-modal-quick-close),[tabindex="-1"]',dialog)||heading||dialog;
      if(target&&typeof target.focus==='function')target.focus();
    });
    return bg;
  };
  closeModalRL=function(){
    const bg=$('.rl-modal-bg');if(!bg)return;
    if(activeModalState.keyHandler)document.removeEventListener('keydown',activeModalState.keyHandler,true);
    bg.remove();
    activeModalState.background.forEach(([node,wasInert])=>{if(node&&node.isConnected)node.inert=!!wasInert});
    const opener=activeModalState.opener;activeModalState.opener=null;activeModalState.keyHandler=null;activeModalState.background=[];
    requestAnimationFrame(()=>{if(opener&&opener.isConnected&&typeof opener.focus==='function')opener.focus();else $('#rlMain')?.focus()});
  };

  // Project creation is in-app, validated, cancellable and doesn't discard the current project.
  function openNewProjectDialog(){
    modalRL('<h2>New research project</h2><p class="rl-muted">Create a separate workspace. Your current project remains saved and available in the project selector.</p><div class="rl-form"><div class="rl-field"><label for="rlNewProjectTitle">Project title <span aria-hidden="true">*</span></label><input id="rlNewProjectTitle" maxlength="120" required autocomplete="off" aria-describedby="rlNewProjectHelp rlNewProjectError" placeholder="e.g., Study habits and academic performance"><p id="rlNewProjectHelp" class="rl-small rl-muted">Use 2–120 characters. You can rename it later.</p><p id="rlNewProjectError" class="rl-small" role="alert" hidden></p></div><div class="rl-actions"><button type="button" class="rl-btn" data-close>Cancel</button><button type="button" class="rl-btn primary" id="rlNewProjectSave">Create project</button></div></div>',()=>{
      const input=$('#rlNewProjectTitle'),error=$('#rlNewProjectError');
      const submit=()=>{const title=input.value.trim();if(title.length<2||title.length>120){error.hidden=false;error.textContent='Enter a title between 2 and 120 characters.';input.setAttribute('aria-invalid','true');input.focus();return}
        const duplicate=(JSON.parse(RLStore.getItem('researchlab.projects.v1')||'[]')).some(p=>String(p.title||'').trim().toLowerCase()===title.toLowerCase());
        if(duplicate){error.hidden=false;error.textContent='A project with that title already exists. Choose a distinct title so projects are easy to tell apart.';input.setAttribute('aria-invalid','true');input.focus();return}
        const old=state;const saved=persist();
        state=newProject(title,false);state.schemaVersion=2;activeDataset=null;activeInstrument=null;activeSource=null;
        persist();renderProjectSelect();closeModalRL();setPage('home');toastRL(RLStore.isPersistent()?'New project created and saved.':'New project created in session-only storage. Export a backup before closing.');
      };
      $('#rlNewProjectSave').addEventListener('click',submit);input.addEventListener('keydown',ev=>{if(ev.key==='Enter'){ev.preventDefault();submit()}});input.addEventListener('input',()=>{input.removeAttribute('aria-invalid');error.hidden=true});
    });
  }
  window.__RL_openNewProjectDialog=openNewProjectDialog;
  const newProjectButton=$('#rlNewProject');if(newProjectButton){newProjectButton.onclick=openNewProjectDialog;newProjectButton.setAttribute('aria-haspopup','dialog')}

  // Literature/RRL Matrix: filter records without re-creating the search input or losing focus.
  function literatures(){return Array.isArray(state.sources)?state.sources:[]}
  function visibleLiteratureSources(){
    const q=literatureQuery.trim().toLocaleLowerCase();
    return literatures().filter(src=>{
      if(literatureStatus&&String(src.verificationStatus||'unverified')!==literatureStatus)return false;
      if(!q)return true;
      const hay=[src.title,(src.authors||[]).join(' '),src.findings,src.abstract,src.tags instanceof Array?src.tags.join(' '):src.tags,src.method,src.population,src.variables,src.limitations,src.notes,src.doi,src.url,src.locator].map(v=>String(v??'')).join(' ').toLocaleLowerCase();
      return hay.includes(q);
    });
  }
  function literatureRows(){
    const list=visibleLiteratureSources();
    if(!list.length)return '<tr><td colspan="7"><div class="rl-empty"><strong>No matching studies</strong><span>Try another term, choose a different verification state, or reset the filters. Saved sources have not been changed.</span></div></td></tr>';
    return list.map(src=>`<tr><td><input type="checkbox" data-rrl-select="${esc(src.id)}" aria-label="Select ${esc(src.title)}"></td><td><b>${esc(src.title||'Untitled source')}</b><br>${esc((src.authors||[]).join(', '))} (${esc(src.publicationYear||'n.d.')})<br><span class="rl-small">${esc(src.doi||src.url||'')}</span></td><td>${esc(src.findings||'No finding recorded')}<br><span class="rl-small rl-muted">${esc(src.abstract||'')}</span></td><td>${esc(src.method||'—')}<br>${esc(src.population||'—')}<br>${esc(src.variables||'')}</td><td>${esc(src.limitations||'—')}<br><span class="rl-small">Locator: ${esc(src.locator||'not recorded')}</span></td><td>${statusRL(src.verificationStatus==='student_checked'?'reviewed':src.verificationStatus==='metadata_retrieved'?'ready_for_review':'draft')}<br><span class="rl-small">${esc(({unverified:'Unverified',metadata_retrieved:'Metadata retrieved',student_checked:'Student checked'})[src.verificationStatus]||'Unverified')}</span></td><td><button type="button" class="rl-btn" data-edits="${esc(src.id)}">Open</button></td></tr>`).join('');
  }
  renderLiterature=function(){
    const all=literatures();
    return pageHeader('EVIDENCE','RRL Matrix','Search the source records you entered, verify claims against the source itself, and preserve page/section evidence. Metadata retrieval alone is not verification.',`<button class="rl-btn" id="rlImportSource">DOI / URL</button><button class="rl-btn primary" id="rlAddSource">Add study</button><button class="rl-btn" id="rlExportMatrix">Export CSV</button><button class="rl-btn" id="rlCompareEvidence">Compare selected</button>`)
      +`<div class="rl-note" style="margin-bottom:13px"><b>Source rule:</b> inaccessible or scanned files are not treated as read. Automated comparisons are heuristics, not source verification or proof of novelty.</div>
      <div class="rl-filter" aria-label="Literature filters"><div class="rl-filter-field"><label for="rlSourceSearch">Search title, author, finding, method, or theme</label><input id="rlSourceSearch" type="search" value="${esc(literatureQuery)}" autocomplete="off" placeholder="Type at least a few characters"></div><div class="rl-filter-field"><label for="rlSourceFilter">Verification status</label><select id="rlSourceFilter"><option value="" ${!literatureStatus?'selected':''}>All verification states</option><option value="unverified" ${literatureStatus==='unverified'?'selected':''}>Unverified</option><option value="metadata_retrieved" ${literatureStatus==='metadata_retrieved'?'selected':''}>Metadata retrieved</option><option value="student_checked" ${literatureStatus==='student_checked'?'selected':''}>Student checked</option></select></div><button type="button" class="rl-btn" id="rlClearLiteratureFilters" ${!literatureQuery&&!literatureStatus?'disabled':''}>Reset filters</button><span id="rlLiteratureCount" class="rl-small rl-muted" role="status" aria-live="polite">Showing ${visibleLiteratureSources().length} of ${all.length} studies</span></div>
      <section class="rl-card"><div class="rl-table-wrap" role="region" tabindex="0" aria-label="Literature matrix table; scroll horizontally to read all columns"><table class="rl-table"><thead><tr><th scope="col">Select</th><th scope="col">Study / citation</th><th scope="col">Purpose &amp; finding</th><th scope="col">Method / population</th><th scope="col">Limitations / locator</th><th scope="col">Status</th><th scope="col">Action</th></tr></thead><tbody id="rlLiteratureTbody">${literatureRows()}</tbody></table></div></section>`;
  };
  function updateLiteratureTable(){
    const body=$('#rlLiteratureTbody');if(body)body.innerHTML=literatureRows();
    const count=$('#rlLiteratureCount');if(count)count.textContent=`Showing ${visibleLiteratureSources().length} of ${literatures().length} studies`;
    const reset=$('#rlClearLiteratureFilters');if(reset)reset.disabled=!literatureQuery&&!literatureStatus;
  }
  literatureFilterWire=function(){
    const search=$('#rlSourceSearch'),filter=$('#rlSourceFilter'),reset=$('#rlClearLiteratureFilters');
    if(search){search.value=literatureQuery;search.addEventListener('input',()=>{literatureQuery=search.value;updateLiteratureTable()})}
    if(filter){filter.value=literatureStatus;filter.addEventListener('change',()=>{literatureStatus=filter.value;updateLiteratureTable()})}
    if(reset)reset.addEventListener('click',()=>{literatureQuery='';literatureStatus='';if(search)search.value='';if(filter)filter.value='';updateLiteratureTable();search?.focus()});
  };

  // Project clearing distinguishes a safe content reset from deleting all project records and indexes.
  function clearCurrentProject(){
    modalRL('<h2>Clear this project?</h2><div class="rl-warn"><b>This cannot be undone from the workspace.</b> Download a project backup first if you may need the questions, sources, instrument, dataset versions, or results later.</div><p>This resets this project to an empty workspace while keeping its title and project identity. Other projects are not changed.</p><div class="rl-actions"><button class="rl-btn" data-close>Cancel</button><button type="button" class="rl-btn danger" id="rlConfirmClearProject">Clear project content</button></div>',()=>$('#rlConfirmClearProject').addEventListener('click',()=>{
      const previous=state;const fresh=newProject(previous.title||'My Research Project',false);fresh.id=previous.id;fresh.createdAt=previous.createdAt||fresh.createdAt;fresh.schemaVersion=2;fresh.settings={...(previous.settings||{}),autosave:true};
      state=fresh;activeDataset=null;activeInstrument=null;activeSource=null;persist();renderProjectSelect();closeModalRL();setPage('home');toastRL(RLStore.isPersistent()?'Project content cleared. Other projects are unchanged.':'Project cleared for this session only; export a backup if needed.');
    }));
  }
  function clearAllProjects(){
    modalRL('<h2>Delete all saved ResearchLab projects?</h2><div class="rl-error"><b>Destructive action.</b> This permanently deletes every saved ResearchLab project in this browser, including archived projects and project indexes. Download backups first.</div><p>The display preference (light/dark mode) will be kept. After deletion, a new empty project will be created.</p><div class="rl-actions"><button class="rl-btn" data-close>Cancel</button><button type="button" class="rl-btn danger" id="rlConfirmClearAll">Delete all saved projects</button></div>',()=>$('#rlConfirmClearAll').addEventListener('click',()=>{
      const keys=new Set(RLStore.keys().filter(k=>k==='researchlab.project.v1'||k==='researchlab.activeProject.v2'||k==='researchlab.projects.v1'||k.startsWith('researchlab.project.v2.')));
      keys.add('researchlab.project.v1');keys.add('researchlab.activeProject.v2');keys.add('researchlab.projects.v1');
      for(const key of keys)RLStore.removeItem(key);
      state=newProject('My Research Project',false);state.schemaVersion=2;activeDataset=null;activeInstrument=null;activeSource=null;
      const saved=persist();renderProjectSelect();closeModalRL();setPage('home');
      toastRL(RLStore.isPersistent()?'All previous ResearchLab projects were deleted. A new empty project is ready.':'Previous project records were cleared from accessible session storage, but persistent browser storage is unavailable. Verify storage and download backups before closing.');
    }));
  }
  const oldWire=wireGlobalPage;
  wireGlobalPage=function(){
    oldWire();
    const clear=$('#rlClearLocal');if(clear)clear.onclick=clearCurrentProject;
    const clearAll=$('#rlClearAll');if(clearAll)clearAll.onclick=clearAllProjects;
  };

  // Network/privacy copy stays explicit and storage mode cannot imply a cloud connection.
  const settingsRenderer=renderSettings;
  renderSettings=function(){
    let html=settingsRenderer();
    html=html.replace('This standalone edition uses browser-local storage. A cloud option is represented in the data model but is not connected here, so no respondent data is uploaded automatically.','This standalone edition stores project content in browser storage when available. Private cloud is not connected. Literature metadata queries send the DOI/URL or search terms you submit to the relevant external service; this does not automatically upload your project or respondent dataset.');
    html=html.replace('<div id="rlCloudNote"></div>','<div id="rlCloudNote"></div><p id="rlStorageDetails" class="rl-note" role="status" aria-live="polite"></p>');
    html=html.replace('Use the separate all-projects action below to delete every saved ResearchLab project on this device. Export a backup before destructive changes.','Use the separate all-projects action below to delete every saved ResearchLab project on this device. Export a backup before destructive changes.');
    html=html.replace('<button class="rl-btn" id="rlClearLocal">Clear this project</button>', '<button class="rl-btn" id="rlClearLocal">Clear this project</button><button class="rl-btn danger" id="rlClearAll">Delete all saved projects on this device</button>');
    html=html.replace('<div class="rl-card rl-danger-zone"', '<div class="rl-card" style="margin-top:13px"><h2>Network &amp; privacy</h2><p class="rl-small">Project saves are local when browser storage is available. OpenAlex/Crossref literature searches send the submitted query or DOI/URL to those services. Some spreadsheet/model features download third-party libraries or models and need internet access. When network features fail, enter source metadata manually and export backups regularly.</p><p class="rl-small rl-muted">ResearchLab heuristic checks cannot establish novelty, construct validity, ethics approval, or statistical correctness.</p></div><div class="rl-card rl-danger-zone"');
    return html;
  };

  // Backup restore creates a separate project if restoring would overwrite an existing one.
  importBackup= function(){
    const input=document.createElement('input');input.type='file';input.accept='.json,application/json';input.setAttribute('aria-label','Choose a ResearchLab JSON backup');
    input.onchange=async()=>{const file=input.files&&input.files[0];if(!file)return;try{
      const backup=JSON.parse(await file.text());if(!backup||backup.exportFormat!=='researchlab-project-v1'||!backup.id)throw new Error('This file is not a supported ResearchLab project JSON backup. Choose a backup exported by ResearchLab.');
      const index=JSON.parse(RLStore.getItem('researchlab.projects.v1')||'[]');const exists=Array.isArray(index)&&index.some(p=>p.id===backup.id)||RLStore.getItem('researchlab.project.v2.'+backup.id);
      const restored=JSON.parse(JSON.stringify(backup));delete restored.exportedAt;delete restored.exportFormat;
      if(exists){restored.id=uidRL();restored.title=String(restored.title||'Restored project')+' (restored copy)';for(const group of ['questions','objectives','hypotheses','variables','plannedAnalyses','sources','gaps','instruments','datasets','results']){(restored[group]||[]).forEach(r=>{if(r&&Object.prototype.hasOwnProperty.call(r,'projectId'))r.projectId=restored.id})}}
      restored.schemaVersion=2;restored.version=1;restored.status='active';restored.updatedAt=nowRL();
      state=restored;activeDataset=state.datasets?.slice().sort((a,b)=>(a.versionNumber||0)-(b.versionNumber||0)).slice(-1)[0]||null;activeInstrument=null;activeSource=null;
      persist();renderProjectSelect();setPage('home');toastRL(RLStore.isPersistent()?'Backup restored as '+state.title+'.':'Backup loaded for this session only. Download it again after verifying storage availability.');
    }catch(err){toastRL('Backup restore failed: '+String(err&&err.message||err)+' No current project was intentionally replaced.')}};
    input.click();
  };

  // Mobile navigation acts as a disclosure/drawer, with backdrop, Escape, inert main content and focus return.
  const side=$('#rlSide'),menu=$('#rlMenu'),main=$('#rlMain');
  if(side&&menu&&main){
    side.id=side.id||'rlSide';menu.setAttribute('aria-controls','rlSide');menu.setAttribute('aria-expanded','false');
    navBackdrop=document.createElement('button');navBackdrop.type='button';navBackdrop.id='rlNavBackdrop';navBackdrop.className='rl-nav-backdrop';navBackdrop.hidden=true;navBackdrop.setAttribute('aria-label','Close navigation');document.body.appendChild(navBackdrop);
    const mobile=()=>window.matchMedia('(max-width: 760px)').matches;
    const closeDrawer=(returnFocus=true)=>{side.classList.remove('open');navBackdrop.hidden=true;menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation');menu.title='Open navigation';main.inert=false;side.inert=mobile();if(returnFocus)menu.focus()};
    const openDrawer=()=>{side.inert=false;main.inert=true;side.classList.add('open');navBackdrop.hidden=false;menu.setAttribute('aria-expanded','true');menu.setAttribute('aria-label','Close navigation');menu.title='Close navigation';const first=$('#rlSide button[data-page]');first?.focus()};
    menu.onclick=()=>{if(side.classList.contains('open'))closeDrawer(true);else openDrawer()};navBackdrop.addEventListener('click',()=>closeDrawer(true));
    window.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&side.classList.contains('open')&&!$('.rl-modal-bg')){ev.preventDefault();closeDrawer(true)}});
    document.addEventListener('keydown',ev=>{if(!mobile()||!side.classList.contains('open')||ev.key!=='Tab')return;const items=[menu,...$$('#rlSide button:not([disabled]), #rlSide a[href], #rlSide summary')].filter(el=>el.offsetParent!==null);if(!items.length)return;const first=items[0],last=items[items.length-1];if(ev.shiftKey&&document.activeElement===first){ev.preventDefault();last.focus()}else if(!ev.shiftKey&&document.activeElement===last){ev.preventDefault();first.focus()}});
    const priorSetPage=setPage;setPage=function(p){const r=priorSetPage(p);closeDrawer(false);$('#rlMain')?.focus();return r};
    const setDrawerMode=()=>{if(!mobile()){side.inert=false;main.inert=false;navBackdrop.hidden=true;side.classList.remove('open');menu.setAttribute('aria-expanded','false');menu.setAttribute('aria-label','Open navigation')}else if(!side.classList.contains('open'))side.inert=true};
    window.addEventListener('resize',setDrawerMode);setDrawerMode();
  }

  // Keep active-page state explicit and make every wide data table discoverable as a scroll region.
  function improveTables(){
    $$('.rl-table-wrap').forEach((wrap,i)=>{if(!wrap.hasAttribute('role'))wrap.setAttribute('role','region');if(!wrap.hasAttribute('tabindex'))wrap.setAttribute('tabindex','0');if(!wrap.hasAttribute('aria-label')){const table=$('table',wrap);const caption=$('caption',table||wrap);wrap.setAttribute('aria-label',caption?.textContent?.trim()||`Data table ${i+1}; scroll horizontally to read all columns`)}});
    $$('.rl-table thead th').forEach(th=>{if(!th.hasAttribute('scope'))th.setAttribute('scope','col')});
  }
  const priorRenderPage=renderPage;
  renderPage=function(){const r=priorRenderPage();improveTables();if(activePage==='literature'){const q=$('#rlSourceSearch');if(q)q.value=literatureQuery;const f=$('#rlSourceFilter');if(f)f.value=literatureStatus}updateStorage();return r};

  // Clear project/setting controls are attached on every re-render by the global wiring.
  // Make cloud state truthful: changing the dropdown never claims a non-existent cloud service.
  const originalWire=wireGlobalPage;
  wireGlobalPage=function(){originalWire();const sm=$('#rlStorageMode');if(sm){const option=sm.querySelector('option[value="cloud_private"]');if(option){option.disabled=true;option.textContent='Private cloud (not connected)'}sm.value='local_only'}const note=$('#rlCloudNote');if(note&&state.storageMode==='cloud_private')note.innerHTML='<div class="rl-warn" style="margin-top:10px"><b>Private cloud is not connected.</b> This standalone application cannot sync to a cloud repository. Data remains local when persistent browser storage is available.</div>';const clear=$('#rlClearLocal');if(clear)clear.onclick=clearCurrentProject;const clearAll=$('#rlClearAll');if(clearAll)clearAll.onclick=clearAllProjects;}

  // Project setting controls and project switcher are synchronized after existing wrappers run.
  const priorSelectChange=$('#rlProjectSelect');if(priorSelectChange){priorSelectChange.setAttribute('aria-label','Choose the active research project');}
  // Render current screen after all render/wiring overrides have been installed.
  try{renderProjectSelect();renderPage();const currentNewProjectButton=$('#rlNewProject');if(currentNewProjectButton){currentNewProjectButton.onclick=openNewProjectDialog;currentNewProjectButton.setAttribute('aria-haspopup','dialog')}if(window.__RL_BOOT_WARNING)toastRL(window.__RL_BOOT_WARNING);else if(window.__RL_BOOT_MIGRATED)toastRL('Your legacy project was restored and will be saved in the current project format.');else if(!RLStore.isPersistent())toastRL('Session-only storage is active. Export a project backup before refreshing or closing.')}catch(err){console.error('Final ResearchLab integration failed',err);toastRL('Some accessibility enhancements did not initialize. Your project data was not intentionally deleted.')}
})();
</script>
